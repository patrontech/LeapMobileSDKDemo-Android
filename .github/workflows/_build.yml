on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
  
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          if [ "${{ github.ref_name }}" == "master" ]; then
            echo "Building prod APK"
            ./gradlew assembleProd -PciVersionCode=${{ github.run_number }}
          else
            echo "Building debug APK"
            ./gradlew assembleDebug -PciVersionCode=${{ github.run_number }}
          fi
        env:
          GITHUB_USERNAME: ${{ vars.GH_USER }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: APK Directory
        id: apk_dir
        run: |
          if [ "${{ github.ref_name }}" == "master" ]; then
            apkDir="app/build/outputs/apk/prod"
          else
            apkDir="app/build/outputs/apk/debug"
          fi
          echo "apkDir=$apkDir" >> $GITHUB_OUTPUT

      - name: Sign app APK
        if: github.event_name != 'pull_request'
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407
        id: sign_app
        with:
          releaseDirectory: ${{ steps.apk_dir.outputs.apkDir }}
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload stage APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{github.run_number}}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 14